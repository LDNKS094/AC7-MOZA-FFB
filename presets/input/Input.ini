; AC7 input preset: MOZA AB6 + attached grip, and MTQ.
; Install.cmd requires the game's existing Input.ini: connect controllers, start AC7, then exit.
; It matches ProductName to this preset and copies bindings into existing device sections.
; Existing GUIDs, other devices and unrelated settings are kept; this file is not copied whole.
; Backup name: Input.ini.<timestamp>.bak. Each update keeps earlier backups.
; Target: %LOCALAPPDATA%\BANDAI NAMCO Entertainment\ACE COMBAT 7\Config\Input.ini
; Exit the game before editing. To restore previous bindings, replace Input.ini with a backup.
; Uninstall.cmd leaves Input.ini and its backups in place.
; Other models without a matching binding scheme are left unchanged; use the guide below.
;
; USING A DIFFERENT DEVICE MODEL
; 1. Connect your device, start AC7 once, then exit and open the game's Input.ini.
; 2. Find its [Joystick-...] section using ProductName. Keep that section header/GUID.
;    The GUID is DirectInput's PRODUCT GUID, not its instance GUID or USB serial number.
;    Do not copy the AB6/MTQ GUID below onto a different model. Changing ProductName alone
;    does not redirect bindings to another device. If AC7 has not generated a device section,
;    confirm Windows/DirectInput sees it before trying these example bindings.
; 3. Copy desired Flight_* / UI_* entries into the matching section and replace the input
;    on the right with your device's actual button/axis. The action names stay the same.
;    Example: Flight_AutoPilot=Button7 if YOUR chosen level-flight button is Button7.
; 4. Find physical button numbers using the vendor's input tester or a DirectInput tester.
;    AC7 ButtonN is one-based: a tester reporting zero-based button index 64 means Button65.
;    Tester naming varies; check whether it starts at 0 or 1. Button65 is an MTQ example,
;    not a universal level-flight button. A different grip can change the AB6 button layout.
; 5. Axis letters and direction can also differ. Verify pitch/roll/yaw/throttle in game;
;    reuse your working axis bindings where possible. Add/remove :R to reverse an axis.
;
; MULTIPLE DEVICES
; Buttons belong to their device section: AB6 Button1 and MTQ Button1 are independent.
; A grip connected through AB6 is currently reported as part of AB6, not a third device.
; Same-model devices may share a product GUID/config section; this example does not add
; separate instance-specific binding syntax. Do not combine different devices into one section.
;
; SUPPORTED INPUTS
; X, Y, Z, Rx, Ry, Rz, Slider1-2; POV_U/D/L/R1-4; Button1-128 with AC7NativeInput.asi.
; Without the input ASI, the original game supports Button1-32. Higher numbers are unsupported.
; Use only Button1-128. Out-of-range hand-written values have no defined mapping.
; :P positive half, :N negative half, :R reverse, :C convert -1..1 to 0..1.
; A & B: A only while B is active. A ! B: A only while B is inactive.
; A + B: add values. A > B / A < B: choose larger/smaller value.
; A blank value means this action has no binding in this device section.
;
; Flight_* controls flying; UI_* controls menu navigation, configured separately.
; Button65 -> level flight was user-tested on MTQ. Other entries reproduce the current
; local configuration; they are examples, not a claim that every physical control was tested.

